# 注册内容单一真源（registration single source of truth）
#
# 用途：注册填报表的单一真源；按 PROSPERO 字段号组织，逐字段可直接粘贴。
#       （逐字段可直接粘贴的英文文本）。
# 规则：改注册文本只改本文件，不改产物。产物每次重算。
#
# 四个区块：
#   prose          —— 人工撰写的字段正文（键 = PROSPERO 字段号，字符串）
#   facts          —— 由项目产物算出的字段（键 = 字段号，值 = 事实名）
#   manual         —— 必须在网页表单里由登记者本人做的操作（本文件不代填）
#   optional_blank —— 有意留空的非必填字段
#
# 校验：1..40 必须被上述四区块全覆盖；必填字段不得落在 manual / optional_blank。
---
meta:
  project: melatonin-sleep-perf
  registry: prospero
  # 本文件内容对应的事件时间（不含产物重算时间）
  drafted: 2026-10-19
  # 注册语言（PROSPERO 要求英文，正式记录只用英文）
  language: en
  # 中文正文另存，仅供内部核对，不提交
  companion_cn: assessment/registration/osf-protocol.md

# ★★ 一致性开关（小何裁定项，不是默认值）
#   include_timing_note: true  → 字段 39 会附上「本记录为回顾性登记」的说明，与字段 5 的阶段勾选一致
#   include_timing_note: false → 不附该说明；此时字段 5 的勾选与字段 39 之间会留下可被抽查的缺口
# 本开关由渲染器显式打印在产物顶部，不允许静默。
flags:
  include_timing_note: false

# ---------------------------------------------------------------- 事实（自动）
# 字段 16 由 search/totals.json + tracking/* 算出，不写死数字；换项目换数据即变。
facts:
  "16": search.databases_and_tracking

# ---------------------------------------------------------------- 网页操作（人工）
manual:
  "5": >-
    阶段勾选（Started / Completed 两组复选框）+ 可选补充说明。
    这是登记者本人的声明项：PROSPERO 条款写明「Reviews must be registered before data
    extraction has started」，且「Action will be taken if inaccuracies ... including
    information supplied about the stage of review ... Deliberate falsification 视为
    research misconduct」。本文件不代填，也不为该项提供脚本值。
  "38": >-
    Current review status。必须与字段 5 的勾选自洽；勾选后不可编辑。

# ---------------------------------------------------------------- 有意留空
optional_blank:
  "9": 联系电话非必填，留空（PROSPERO 会把字段 8 地址公开，故地址也只填机构层级）。

# ---------------------------------------------------------------- 正文
prose:
  "1": |-
    Oral melatonin supplementation and sleep, exercise performance, oxidative stress
    and inflammation in exercising populations: a systematic review and meta-analysis

  "2": |-
    口服褪黑素补充对运动人群睡眠、运动表现、氧化应激与炎症的影响：系统综述与 Meta 分析

  "3": |-
    17 October 2026.
    (Date on which the eligibility criteria and the analysis plan were complete and the
